# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kind_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Connection Pool (HikariCP - default in Spring Boot)
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# DDL Auto (creates/updates tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Format SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# Logging for debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT secret token
jwt.secret=4b6f8c2d9e1a3f7b0d4e6a8c2f5b1d3e7a9c0f2b4d6e8a1c3f5b7d9e0a2c4f68
jwt.expiration=86400000

# OpenAI
openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}