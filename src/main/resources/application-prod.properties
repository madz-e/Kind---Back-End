server.port=3000
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kind_db
spring.datasource.username=kind
spring.datasource.password=kind

# Connection Pool (HikariCP - default in Spring Boot)
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# DDL Auto (creates/updates tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Format SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# Logging for debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE